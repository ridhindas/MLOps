name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Set up Python
      # ----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ----------------------------------------
      # 3. Install dependencies & run tests
      # ----------------------------------------
      - name: Run Pipeline Validation & Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -v

      # ----------------------------------------
      # 4. Log in to Docker Hub
      # ----------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------
      # 5. Set up Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # 6. Build Docker image
      # ----------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/iris-mlops-api:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/iris-mlops-api:latest \
            .

      # ----------------------------------------
      # 7. Push Docker image
      # ----------------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/iris-mlops-api:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/iris-mlops-api:latest

      # ----------------------------------------
      # 8. Deploy to Remote Linux VM
      # ----------------------------------------
      - name: Deploy Container to Remote Linux VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/iris-mlops-api:${{ github.sha }}"

            echo "Pulling Docker image..."
            docker pull "$IMAGE"

            echo "Stopping existing container..."
            docker stop iris-api || true

            echo "Removing existing container..."
            docker rm iris-api || true

            echo "Starting new container..."
            docker run -d \
              --restart unless-stopped \
              -p 8000:8000 \
              --name iris-api \
              "$IMAGE"

            echo "Waiting for application to start..."
            sleep 5

            echo "Checking container status..."
            docker ps --filter "name=iris-api"

            echo "Checking application health..."
            curl --fail http://localhost:8000/ || exit 1

            echo "Deployment successful!"
